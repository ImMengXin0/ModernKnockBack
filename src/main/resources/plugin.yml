name: ModernKnockBack
version: '3.0.0'
main: cn.mx.modernkb.ModernKnockbackPlugin
api-version: '1.21.11'
folia-supported: true
description: Switchable classic and modern combat knockback profiles for Paper, Leaf, ASPaper and Folia.
authors: [MX]
softdepend: [KnockbackSync, Citizens]
commands:
  kbtest:
    description: 切换战斗模式、重载配置或采集 KB 分析报告
    usage: /kbtest classic|modern|reload 或 /kbtest profiler open|stop|status|report
    permission: modernkb.admin
    permission-message: '§8[§bKB§8]§r §c[!] §f缺少权限节点 §7modernkb.admin'
  modernkb:
    aliases: [mkb, kb]
    description: 击退参数配置菜单与运行状态诊断
    permission: modernkb.admin
    permission-message: '§8[§bKB§8]§r §c[!] §f缺少权限节点 §7modernkb.admin'
permissions:
  modernkb.admin:
    default: op
